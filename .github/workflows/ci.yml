name: Build and deployment checks
on:
  pull_request:
  push:
    branches: [main, codex/deployment-prep-20261024]
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security-gate.yml
  verify:
    needs: ["security"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPABASE_URL: https://synthetic.invalid
      SUPABASE_ANON_KEY: synthetic-public-key
      SUPABASE_SERVICE_ROLE_KEY: synthetic-server-secret
      CORS_ORIGIN: https://cardlink.example.test
      APP_PORT: "14000"
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            2026706445/backend/package-lock.json
            2026706445/frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verified event deployment workflow regressions
        run: python3 scripts/deploy/test_event_workflow.py
      - name: Runtime image security gate regressions
        run: python -m unittest discover -s scripts/security -p 'test_*.py' -v
      - name: PostgreSQL profile privacy red-green regression
        run: |
          docker cp 2026706445/backend ${{ job.services.postgres.id }}:/work
          docker exec ${{ job.services.postgres.id }} psql -U postgres -X -v ON_ERROR_STOP=1 -f /work/test/sql/profile-privacy.sql
      - name: PostgreSQL initial order status authorization
        run: docker exec ${{ job.services.postgres.id }} psql -U postgres -X -v ON_ERROR_STOP=1 -f /work/test/sql/physical-card-initial-status.sql
      - run: npm ci && npm test
        working-directory: 2026706445/backend
      - run: npm ci && npm test && npm run build
        working-directory: 2026706445/frontend
        env:
          VITE_SUPABASE_URL: https://synthetic.invalid
          VITE_SUPABASE_ANON_KEY: synthetic-public-key
      - name: Production image and HTTP smoke (no external requests)
        run: |
          set -euo pipefail
          docker compose -f compose.production.yaml config --quiet
          docker compose -f compose.production.yaml build --build-arg REVISION_SHA="$GITHUB_SHA"
          docker compose -f compose.production.yaml up -d --wait
          curl --fail http://127.0.0.1:14000/api/health
          curl --fail http://127.0.0.1:14000/auth/callback | grep '<div id="app">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:14000/api/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:14000/api/unknown)" = 404
          docker compose -f compose.production.yaml exec -T app sh -c '! grep -R "synthetic-server-secret\|127.0.0.1:4000/api" /app/frontend/dist'
          docker compose -f compose.production.yaml exec -T app sh -c 'test -z "$(find /app -name ".env*")"'
          if docker run --rm --network none -e NODE_ENV=production cardlink:ci; then exit 1; fi
          if docker run --rm --network none -e NODE_ENV=production -e ENABLE_LOCAL_AUTH=true -e SUPABASE_URL -e SUPABASE_ANON_KEY -e SUPABASE_SERVICE_ROLE_KEY -e CORS_ORIGIN cardlink:ci; then exit 1; fi
      - name: Gate the synthetic production image OS and Node libraries
        run: |
          docker run --rm --network none --entrypoint sh cardlink:ci -ec 'test -s /etc/alpine-release; for tool in npm npx yarn yarnpkg; do test -z "$(command -v "$tool")"; done; node --version >/dev/null'
          image_id=$(docker image inspect cardlink:ci --format '{{.Id}}')
          bash scripts/security/scan-image.sh "$image_id"
      - if: always()
        run: docker compose -f compose.production.yaml down
      - name: Build actual Cardlink release (required public Supabase configuration)
        if: github.event_name == 'push'
        env:
          SUPABASE_URL: ${{ secrets.CARDLINK_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.CARDLINK_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo 'Configure CARDLINK_SUPABASE_URL and CARDLINK_SUPABASE_ANON_KEY before releasing'; exit 1; }
          docker compose -f compose.production.yaml build --build-arg REVISION_SHA="$GITHUB_SHA"
          docker compose -f compose.production.yaml up -d --no-build --wait
          curl --fail http://127.0.0.1:14000/api/health
          curl --fail http://127.0.0.1:14000/auth/callback | grep '<div id="app">'
          docker compose -f compose.production.yaml down
      - name: Gate the actual public Supabase release image OS and Node libraries
        if: github.event_name == 'push'
        run: |
          docker run --rm --network none --entrypoint sh cardlink:ci -ec 'test -s /etc/alpine-release; for tool in npm npx yarn yarnpkg; do test -z "$(command -v "$tool")"; done; node --version >/dev/null'
          image_id=$(docker image inspect cardlink:ci --format '{{.Id}}')
          bash scripts/security/scan-image.sh "$image_id"
      - name: Package verified immutable image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$(docker image inspect cardlink:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker tag cardlink:ci cardlink:$GITHUB_SHA
          mkdir -p release
          docker save cardlink:$GITHUB_SHA | gzip > release/image.tar.gz
          (cd release && sha256sum image.tar.gz > image.sha256)
          echo "$GITHUB_SHA" > release/revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push'
        with:
          name: five-sites-app-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
